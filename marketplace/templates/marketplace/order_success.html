{% extends 'marketplace/base.html' %}
{% block content %}
<div class="container my-5 text-center">
  <div class="card shadow-sm mx-auto" style="max-width:600px;">
    <div class="card-body py-5">
      <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
      <h2 class="mt-3">Order Placed!</h2>
      <p class="text-muted">Order #{{ order.id }} — Total ₹{{ order.total_amount }}</p>
      <a href="{% url 'my_orders' %}" class="btn btn-success">View My Orders</a>
      <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Continue Shopping</a>
    </div>
  </div>
</div>
{% endblock %}
